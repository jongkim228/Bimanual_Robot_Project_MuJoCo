left_bottle_pose_controller:
  type: panda_bottle_pose_controller/BottlePoseController
  arm_id: left
  base_frame: left_link0
  # TEST PLACEHOLDER: target flange pose in panda_left_link0, not bottle centre.
  target_xyz: [0.45, 0.20, 0.35]
  target_quaternion: [1.0, 0.0, 0.0, 0.0]  # [w,x,y,z]
  motion_duration: 10.0
  max_translation: 1.5
  max_rotation: 3.2

right_bottle_pose_controller:
  type: panda_bottle_pose_controller/BottlePoseController
  arm_id: right
  base_frame: right_link0
  # TEST PLACEHOLDER: target flange pose in panda_left_link0, not bottle centre.
  target_xyz: [0.45, 0.20, 0.35]
  target_quaternion: [1.0, 0.0, 0.0, 0.0]  # [w,x,y,z]
  motion_duration: 10.0
  max_translation: 1.5
  max_rotation: 3.2